<!doctype html>
<html lang="en">
  <head>
    <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-T6MV6GTZ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0d1020" />
    <title>Slicefall</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  </head>
  <body>
    <div id="app">
      <div id="stage">
        <canvas id="game" aria-label="Game field"></canvas>
        <button id="pausebtn" hidden tabindex="-1" aria-label="Pause">
          <svg class="ico" viewBox="0 0 10 12" aria-hidden="true"><rect x="0" y="0" width="3.5" height="12" rx="1" /><rect x="6.5" y="0" width="3.5" height="12" rx="1" /></svg>
          Pause <span class="kbd">P</span>
        </button>
        <div id="toast" aria-live="polite"></div>
        <div id="overlay" hidden></div>
      </div>
      <div id="touch" hidden>
        <div id="spin" role="group" aria-label="Rotate: slide left or right">
          <span class="hint">⟲</span>
          <span class="hint">⟳</span>
          <div class="knob"></div>
        </div>
        <div id="stick" role="group" aria-label="Move: drag left, right or down">
          <div class="knob"></div>
        </div>
      </div>
    </div>
    <div id="version"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
